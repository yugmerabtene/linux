name: Send Kernel Patches Batch 4

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: 'Mailjet API Key'
        required: true
        type: password
      secret_key:
        description: 'Mailjet Secret Key'
        required: true
        type: password

jobs:
  send-clk:
    runs-on: ubuntu-latest
    steps:
      - name: Download CLK patches
        run: |
          mkdir -p patches
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v4-patches-batch4/0001-clk-qcom-turingcc-qcs404-use-dev_err_probe.patch -o patches/0001-clk-qcom-turingcc-qcs404-use-dev_err_probe.patch
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v4-patches-batch4/0002-clk-qcom-hfpll-use-dev_err_probe.patch -o patches/0002-clk-qcom-hfpll-use-dev_err_probe.patch
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v4-patches-batch4/0003-clk-qcom-a53-pll-use-dev_err_probe.patch -o patches/0003-clk-qcom-a53-pll-use-dev_err_probe.patch
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v4-patches-batch4/0004-clk-qcom-apcs-msm8916-use-dev_err_probe.patch -o patches/0004-clk-qcom-apcs-msm8916-use-dev_err_probe.patch
          ls -la patches/

      - name: Send CLK patches
        env:
          API_KEY: ${{ inputs.api_key }}
          SECRET_KEY: ${{ inputs.secret_key }}
        run: |
          npm install nodemailer --silent
          node -e "const nm=require('nodemailer'),fs=require('fs'),path=require('path');const t=nm.createTransport({host:'in-v3.mailjet.com',port:587,secure:false,auth:{user:process.env.API_KEY,pass:process.env.SECRET_KEY}});const p=fs.readdirSync('patches').filter(f=>f.endsWith('.patch')).sort();t.sendMail({from:'yugmerabtene <contact@yug.be>',to:'linux-clk@vger.kernel.org',subject:'[PATCH 0/'+p.length+'] clk: qcom: use dev_err_probe()',text:'CLK qcom: convert dev_err+return to dev_err_probe().',attachments:p.map(f=>({filename:f,path:path.join('patches',f)}))},(e,r)=>{if(e){console.error('Error:',e.message);process.exit(1)}console.log('SUCCESS!',r.response)});"

  send-usb:
    runs-on: ubuntu-latest
    steps:
      - name: Download USB patches
        run: |
          mkdir -p patches
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v4-patches-batch4/0005-usb-host-ohci-at91-use-dev_err_probe.patch -o patches/0005-usb-host-ohci-at91-use-dev_err_probe.patch
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v4-patches-batch4/0006-usb-host-xhci-histb-use-dev_err_probe.patch -o patches/0006-usb-host-xhci-histb-use-dev_err_probe.patch
          ls -la patches/

      - name: Send USB patches
        env:
          API_KEY: ${{ inputs.api_key }}
          SECRET_KEY: ${{ inputs.secret_key }}
        run: |
          npm install nodemailer --silent
          node -e "const nm=require('nodemailer'),fs=require('fs'),path=require('path');const t=nm.createTransport({host:'in-v3.mailjet.com',port:587,secure:false,auth:{user:process.env.API_KEY,pass:process.env.SECRET_KEY}});const p=fs.readdirSync('patches').filter(f=>f.endsWith('.patch')).sort();t.sendMail({from:'yugmerabtene <contact@yug.be>',to:'linux-usb@vger.kernel.org',subject:'[PATCH 0/'+p.length+'] USB: use dev_err_probe()',text:'USB host: convert dev_err+return to dev_err_probe().',attachments:p.map(f=>({filename:f,path:path.join('patches',f)}))},(e,r)=>{if(e){console.error('Error:',e.message);process.exit(1)}console.log('SUCCESS!',r.response)});"

  send-i2c:
    runs-on: ubuntu-latest
    steps:
      - name: Download I2C patches
        run: |
          mkdir -p patches
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v4-patches-batch4/0007-i2c-sun6i-p2wi-use-dev_err_probe.patch -o patches/0007-i2c-sun6i-p2wi-use-dev_err_probe.patch
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v4-patches-batch4/0008-i2c-owl-use-dev_err_probe.patch -o patches/0008-i2c-owl-use-dev_err_probe.patch
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v4-patches-batch4/0009-i2c-rk3x-use-dev_err_probe.patch -o patches/0009-i2c-rk3x-use-dev_err_probe.patch
          ls -la patches/

      - name: Send I2C patches
        env:
          API_KEY: ${{ inputs.api_key }}
          SECRET_KEY: ${{ inputs.secret_key }}
        run: |
          npm install nodemailer --silent
          node -e "const nm=require('nodemailer'),fs=require('fs'),path=require('path');const t=nm.createTransport({host:'in-v3.mailjet.com',port:587,secure:false,auth:{user:process.env.API_KEY,pass:process.env.SECRET_KEY}});const p=fs.readdirSync('patches').filter(f=>f.endsWith('.patch')).sort();t.sendMail({from:'yugmerabtene <contact@yug.be>',to:'linux-i2c@vger.kernel.org',subject:'[PATCH 0/'+p.length+'] i2c: use dev_err_probe()',text:'I2C busses: convert dev_err+return to dev_err_probe().',attachments:p.map(f=>({filename:f,path:path.join('patches',f)}))},(e,r)=>{if(e){console.error('Error:',e.message);process.exit(1)}console.log('SUCCESS!',r.response)});"
