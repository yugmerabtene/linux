name: Send Kernel Patches Batch 2

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: 'Mailjet API Key'
        required: true
        type: password
      secret_key:
        description: 'Mailjet Secret Key'
        required: true
        type: password

jobs:
  send-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Download docs patches
        run: |
          mkdir -p patches
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v2-patches-batch2/0001-kselftest-fix-timers-test-name.patch -o patches/0001-kselftest-fix-timers-test-name.patch
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v2-patches-batch2/0002-coredump-fix-proc-path.patch -o patches/0002-coredump-fix-proc-path.patch
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v2-patches-batch2/0003-bpf-fix-grammar-libbpf.patch -o patches/0003-bpf-fix-grammar-libbpf.patch
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v2-patches-batch2/0004-resctrl-fix-typo-test-suite.patch -o patches/0004-resctrl-fix-typo-test-suite.patch
          ls -la patches/

      - name: Send docs patches
        env:
          API_KEY: ${{ inputs.api_key }}
          SECRET_KEY: ${{ inputs.secret_key }}
        run: |
          npm install nodemailer --silent
          node -e "const nm=require('nodemailer'),fs=require('fs'),path=require('path');const t=nm.createTransport({host:'in-v3.mailjet.com',port:587,secure:false,auth:{user:process.env.API_KEY,pass:process.env.SECRET_KEY}});const p=fs.readdirSync('patches').filter(f=>f.endsWith('.patch')).sort();t.sendMail({from:'yugmerabtene <contact@yug.be>',to:'linux-kernel@vger.kernel.org',subject:'[PATCH 0/'+p.length+'] docs: fix typos and stale commands',text:'Documentation fixes: typo corrections and command updates.',attachments:p.map(f=>({filename:f,path:path.join('patches',f)}))},(e,r)=>{if(e){console.error('Error:',e.message);process.exit(1)}console.log('SUCCESS!',r.response)});"

  send-iio:
    runs-on: ubuntu-latest
    steps:
      - name: Download IIO patches
        run: |
          mkdir -p patches
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v2-patches-batch2/0005-iio-ad799x-use-sysfs_emit.patch -o patches/0005-iio-ad799x-use-sysfs_emit.patch
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v2-patches-batch2/0006-iio-adf4371-use-sysfs_emit.patch -o patches/0006-iio-adf4371-use-sysfs_emit.patch
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v2-patches-batch2/0007-iio-ad7779-use-dev_err_probe.patch -o patches/0007-iio-ad7779-use-dev_err_probe.patch
          ls -la patches/

      - name: Send IIO patches
        env:
          API_KEY: ${{ inputs.api_key }}
          SECRET_KEY: ${{ inputs.secret_key }}
        run: |
          npm install nodemailer --silent
          node -e "const nm=require('nodemailer'),fs=require('fs'),path=require('path');const t=nm.createTransport({host:'in-v3.mailjet.com',port:587,secure:false,auth:{user:process.env.API_KEY,pass:process.env.SECRET_KEY}});const p=fs.readdirSync('patches').filter(f=>f.endsWith('.patch')).sort();t.sendMail({from:'yugmerabtene <contact@yug.be>',to:'linux-iio@vger.kernel.org, jic23@kernel.org',subject:'[PATCH 0/'+p.length+'] iio: use sysfs_emit and dev_err_probe',text:'IIO driver improvements: sysfs_emit conversions and dev_err_probe usage.',attachments:p.map(f=>({filename:f,path:path.join('patches',f)}))},(e,r)=>{if(e){console.error('Error:',e.message);process.exit(1)}console.log('SUCCESS!',r.response)});"

  send-selftests:
    runs-on: ubuntu-latest
    steps:
      - name: Download selftests patches
        run: |
          mkdir -p patches
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v2-patches-batch2/0008-selftests-kselftest-conflict-flags.patch -o patches/0008-selftests-kselftest-conflict-flags.patch
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v2-patches-batch2/0009-selftests-fix-typo-test-suite.patch -o patches/0009-selftests-fix-typo-test-suite.patch
          ls -la patches/

      - name: Send selftests patches
        env:
          API_KEY: ${{ inputs.api_key }}
          SECRET_KEY: ${{ inputs.secret_key }}
        run: |
          npm install nodemailer --silent
          node -e "const nm=require('nodemailer'),fs=require('fs'),path=require('path');const t=nm.createTransport({host:'in-v3.mailjet.com',port:587,secure:false,auth:{user:process.env.API_KEY,pass:process.env.SECRET_KEY}});const p=fs.readdirSync('patches').filter(f=>f.endsWith('.patch')).sort();t.sendMail({from:'yugmerabtene <contact@yug.be>',to:'linux-kernel@vger.kernel.org, shuah@kernel.org',subject:'[PATCH 0/'+p.length+'] selftests: fixes and improvements',text:'Selftests improvements: argument validation and typo fixes.',attachments:p.map(f=>({filename:f,path:path.join('patches',f)}))},(e,r)=>{if(e){console.error('Error:',e.message);process.exit(1)}console.log('SUCCESS!',r.response)});"
