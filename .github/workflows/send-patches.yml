name: Send Kernel Patches

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: 'Mailjet API Key'
        required: true
        type: password
      secret_key:
        description: 'Mailjet Secret Key'
        required: true
        type: password

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Download patches from release
        run: |
          mkdir -p patches
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v1-patches/0001-staging-iio-adc-ad7816-use-sysfs_emit-for-sysfs-show.patch -o patches/0001-staging-iio-adc-ad7816-use-sysfs_emit-for-sysfs-show.patch
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v1-patches/0002-staging-iio-frequency-ad9834-use-sysfs_emit-in-show-.patch -o patches/0002-staging-iio-frequency-ad9834-use-sysfs_emit-in-show-helpers.patch
          curl -sL https://github.com/yugmerabtene/linux/releases/download/v1-patches/0003-staging-iio-impedance-analyzer-ad5933-use-sysfs_emit.patch -o patches/0003-staging-iio-impedance-analyzer-ad5933-use-sysfs_emit.patch
          ls -la patches/

      - name: Send patches
        env:
          API_KEY: ${{ inputs.api_key }}
          SECRET_KEY: ${{ inputs.secret_key }}
        run: |
          npm install nodemailer --silent
          node -e "
          const nm=require('nodemailer'),fs=require('fs'),path=require('path');
          const t=nm.createTransport({host:'in-v3.mailjet.com',port:587,secure:false,auth:{user:process.env.API_KEY,pass:process.env.SECRET_KEY}});
          const p=fs.readdirSync('patches').filter(f=>f.endsWith('.patch')).sort();
          t.sendMail({from:'yugmerabtene <contact@yug.be>',
            to:'linux-iio@vger.kernel.org, linux-staging@lists.linux.dev, linux-kernel@vger.kernel.org, jic23@kernel.org, gregkh@linuxfoundation.org',
            subject:'[PATCH 0/'+p.length+'] staging: iio: convert sprintf to sysfs_emit',
            text:'Convert sprintf() to sysfs_emit() in staging IIO drivers (ad7816, ad9834, ad5933). Non-functional changes.',
            attachments:p.map(f=>({filename:f,path:path.join('patches',f)}))},
            (e,r)=>{if(e){console.error('Error:',e.message);process.exit(1)}console.log('SUCCESS!',r.response)});
          "
